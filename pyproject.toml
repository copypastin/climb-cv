[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climb-cv"
version = "0.1.0"
description = "Computer vision tools for climbing: pose estimation and climbing-hold detection."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Aaron Nguyen" }]
keywords = ["computer-vision", "climbing", "pose-estimation", "mediapipe", "yolo"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "mediapipe",
    "opencv-python",
    "numpy",
    "matplotlib",
    "ultralytics",
]

[project.urls]
Homepage = "https://github.com/copypastin/climb-cv"
Repository = "https://github.com/copypastin/climb-cv"

[tool.setuptools.packages.find]
where = ["src"]
include = ["climbcv*"]
